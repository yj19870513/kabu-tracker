<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本株 高配当トラッカー</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="高配当トラッカー">
<meta name="theme-color" content="#0a2254">
<style>
  :root { --bg:#f5f7fa; --card:#ffffff; --line:#e2e6ee; --text:#1f2430; --muted:#6b7383;
    --field:#fbfcfe; --shadow:0 1px 2px rgba(20,30,60,.05), 0 1px 8px rgba(20,30,60,.04);
    --red:#c6283d; --orange:#b86b00; --blue:#0b3d91; --aqua:#007f9e; --green:#2f8f3e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif; font-size:14px; line-height:1.6; padding:16px; -webkit-font-smoothing:antialiased; }
  /* 画面を有効活用。カード自体の読みやすさは最小幅で守る */
  .wrap { width:100%; max-width:none; margin:0 auto; }
  h1 { font-size:20px; margin-bottom:4px; }
  .head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .guidelink { font-size:13px; text-decoration:none; border:1px solid var(--line); background:var(--card); border-radius:16px; padding:3px 12px; box-shadow:var(--shadow); }
  .guidelink:hover { border-color:var(--blue); }
  .updated { color:var(--muted); font-size:12px; margin-bottom:12px; }
  /* 統計バー */
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 16px; box-shadow:var(--shadow); min-width:104px; }
  .stat b { font-size:18px; display:block; }
  .stat-primary { border-top:3px solid var(--blue); }
  .stat-good { border-top:3px solid var(--green); }
  .stat-low { border-top:3px solid #5b8fd8; }
  .stat-alert { border-top:3px solid var(--red); }
  .stat-pending { border-top:3px solid #929aa8; }
  .stat span { font-size:11.5px; color:var(--muted); }
  /* 市場環境 */
  .market { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-bottom:12px; display:flex; gap:24px; flex-wrap:wrap; align-items:center; box-shadow:var(--shadow); }
  .market-title { width:100%; font-size:11px; color:var(--muted); letter-spacing:.04em; }
  .market-item { min-width:190px; }
  .market .lbl { font-size:11.5px; color:var(--muted); }
  .market b { font-size:17px; }
  .market input { width:70px; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:14px; }
  .mode-panel { background:linear-gradient(135deg,#fff 0%,#f3f7fd 100%); border:1px solid #cad8ed; border-radius:12px; padding:12px 14px; margin-bottom:12px; box-shadow:var(--shadow); }
  .mode-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .mode-title { font-weight:700; color:#34435e; }
  .mode-switch { display:flex; gap:6px; }
  .mode-btn { border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:18px; padding:6px 14px; cursor:pointer; font-weight:650; }
  .mode-btn.on[data-mode="normal"] { background:var(--blue); border-color:var(--blue); color:#fff; }
  .mode-btn.on[data-mode="crash"] { background:var(--red); border-color:var(--red); color:#fff; }
  .mode-message { margin-top:8px; font-size:13px; color:#34435e; }
  .mode-steps { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:9px; counter-reset:mode; }
  .mode-step { border:1px solid #d9e1ed; background:rgba(255,255,255,.82); border-radius:8px; padding:7px 8px; font-size:11.5px; color:#4b566b; }
  .mode-step::before { counter-increment:mode; content:counter(mode); display:inline-grid; place-items:center; width:18px; height:18px; margin-right:5px; border-radius:50%; background:#e3ebf8; color:var(--blue); font-size:10px; font-weight:700; }
  .signal-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:9px; padding-top:8px; border-top:1px solid #dce4ef; font-size:11.5px; color:var(--muted); }
  .signal-row label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .signal-row input { accent-color:var(--red); }
  .signal-summary { font-weight:700; color:#34435e; }
  .c-green{color:var(--green);} .c-orange{color:var(--orange);} .c-red{color:var(--red);} .c-blue{color:var(--blue);}
  /* フィルター */
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tab { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:16px; padding:5px 14px; cursor:pointer; font-size:13px; box-shadow:var(--shadow); }
  .tab:hover { border-color:#b9c6da; color:var(--text); }
  .tab.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .ctrl { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .ctrl select, .ctrl input { background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; box-shadow:var(--shadow); }
  .fcount { color:var(--muted); font-size:12.5px; margin-bottom:10px; }
  .qf { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .qf button { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:16px; padding:5px 14px; cursor:pointer; font-size:13px; box-shadow:var(--shadow); }
  .qf button.on { background:var(--green); color:#fff; border-color:var(--green); }
  .border-filter { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .border-filter > span { color:var(--muted); font-size:12px; margin-right:2px; }
  .border-filter button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:16px; padding:5px 12px; cursor:pointer; font-size:12.5px; box-shadow:var(--shadow); }
  .border-filter button.on[data-border="blue"] { color:#fff; background:var(--blue); border-color:var(--blue); }
  .border-filter button.on[data-border="aqua"] { color:#fff; background:var(--aqua); border-color:var(--aqua); }
  .border-filter button.on[data-border="green"] { color:#fff; background:var(--green); border-color:var(--green); }
  .border-filter button.on[data-border="amber"] { color:#fff; background:#c07800; border-color:#c07800; }
  .border-filter button.on[data-border="red"], .border-filter button.on[data-border="red-partial"] { color:#fff; background:var(--red); border-color:var(--red); }
  .border-filter button.on[data-border="pending"], .border-filter button.on[data-border="short"] { color:var(--text); background:#e7eaf0; border-color:#aeb6c4; }
  .border-filter button small { opacity:.78; font-size:10px; margin-left:2px; }
  /* カード */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; position:relative; box-shadow:var(--shadow); transition:box-shadow .18s, transform .18s, border-color .18s; }
  .card:hover { box-shadow:0 2px 4px rgba(20,30,60,.08), 0 8px 20px rgba(20,30,60,.07); transform:translateY(-1px); }
  /* 枠は「評価の強さ」を、外側へ薄くなる光と上辺の反射で見せる */
  .card.b-red { border:3px solid var(--red); box-shadow:0 0 0 1px rgba(217,45,67,.18), 0 5px 16px rgba(217,45,67,.16), inset 0 1px 0 rgba(255,255,255,.85); }
  .card.b-red-partial { border:3px dashed var(--red); box-shadow:0 0 0 1px rgba(217,45,67,.12), 0 4px 13px rgba(217,45,67,.11), inset 0 1px 0 rgba(255,255,255,.85); }
  .card.b-amber { border:3px dashed #c07800; box-shadow:0 0 0 1px rgba(192,120,0,.14), 0 4px 13px rgba(192,120,0,.12), inset 0 1px 0 rgba(255,255,255,.85); }
  .card.b-blue { border:4px solid var(--blue); box-shadow:0 0 0 1px rgba(11,61,145,.24), 0 6px 18px rgba(11,61,145,.20), inset 0 1px 0 rgba(255,255,255,.92); }
  .card.b-aqua { border:4px double var(--aqua); box-shadow:0 0 0 1px rgba(0,127,158,.22), 0 5px 16px rgba(0,127,158,.17), inset 0 1px 0 rgba(255,255,255,.92); }
  .card.b-green { border:4px solid var(--green); box-shadow:0 0 0 1px rgba(47,143,62,.20), 0 5px 16px rgba(47,143,62,.16), inset 0 1px 0 rgba(255,255,255,.88); }
  .card .code { color:var(--muted); font-size:12px; }
  .card .name { font-size:15.5px; font-weight:700; margin-bottom:4px; }
  .market-price { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .price-label { color:var(--muted); font-size:10px; font-weight:600; }
  .card .price { font-size:19px; font-weight:700; }
  .card .chg { font-size:12.5px; margin-left:6px; }
  .card .yield { font-size:15px; margin-top:2px; }
  .card .sub { color:var(--muted); font-size:11.5px; margin-top:4px; }
  .divtrend { margin-top:8px; padding-top:7px; border-top:1px solid #eef1f6; }
  .divtrend-head { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:10.5px; }
  .divtrend-label { font-weight:600; }
  .divtrend-label.b-blue { color:var(--blue); }
  .divtrend-label.b-aqua { color:var(--aqua); }
  .divtrend-label.b-green { color:var(--green); }
  .divtrend-label.b-amber { color:#a66500; }
  .divtrend-label.b-red { color:var(--red); }
  .divtrend-label.b-red-partial { color:var(--red); }
  .divtrend-label.b-pending, .divtrend-label.b-short { color:#7b8492; }
  .divspark { display:block; width:100%; height:34px; margin-top:3px; overflow:visible; }
  .divtrend-foot { display:flex; justify-content:space-between; color:var(--muted); font-size:10px; }
  .card-pos, .card-buy { margin-top:8px; padding-top:7px; border-top:1px solid #eef1f6; min-height:64px; }
  .card-pos-head { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:10.5px; }
  .card-pos-head b { color:var(--text); font-weight:600; }
  .card-pos-head b.low { color:var(--blue); }
  .card-pos-head b.high { color:var(--red); }
  .card-posbar { position:relative; height:7px; margin:4px 1px 2px; border-radius:5px; background:linear-gradient(90deg,#4d9ce8 0%,#2fae6d 50%,#e2566c 100%); }
  .card-posbar i { position:absolute; top:-3px; width:3px; height:13px; background:#1f2430; border-radius:2px; box-shadow:0 0 0 1px #fff; }
  .card-pos-labels { display:flex; justify-content:space-between; color:var(--muted); font-size:9.5px; }
  .card-pos-foot { color:var(--muted); font-size:10px; margin-top:2px; }
  .card-buy-head { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--muted); font-size:10.5px; }
  .card-buy-head b { color:var(--text); font-size:11px; }
  .card-buybar { position:relative; height:7px; margin:4px 1px 2px; border-radius:5px; background:linear-gradient(90deg,#2374d8 0%,#39a878 48%,#e6a52f 72%,#d24358 100%); }
  .card-buybar.defensive { background:linear-gradient(90deg,#2374d8 0%,#39a878 42%,#e6a52f 58%,#d24358 100%); }
  .card-buybar::before { content:""; position:absolute; left:50%; top:-2px; height:11px; border-left:1px solid rgba(255,255,255,.9); }
  .card-buybar i { position:absolute; top:-3px; width:3px; height:13px; background:#1f2430; border-radius:2px; box-shadow:0 0 0 1px #fff; }
  .card-buy-labels { display:grid; grid-template-columns:1fr 1fr 1fr; color:var(--muted); font-size:9px; }
  .card-buy-labels span:nth-child(2) { text-align:center; }
  .card-buy-labels span:last-child { text-align:right; }
  .card-buy-meta { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:9.5px; margin-top:2px; }
  .card-buy-52w { display:flex; justify-content:space-between; align-items:center; gap:6px; color:var(--muted); font-size:9.5px; margin-top:7px; }
  .card-buy-52w b { color:var(--text); font-size:10px; }
  .card-buy-52w b.low { color:var(--blue); }
  .card-buy-52w b.high { color:var(--red); }
  .card-posbar.mini { height:5px; margin-top:3px; }
  .card-posbar.mini i { top:-3px; height:11px; }
  .card-buy-52w-foot { display:flex; justify-content:space-between; gap:6px; color:var(--muted); font-size:9px; margin-top:2px; }
  .card-buy.unknown { display:flex; flex-direction:column; justify-content:center; border-top-style:dashed; }
  .card-buy.unknown b { color:var(--orange); font-size:11px; }
  .stability-chip { display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; border-radius:5px; padding:1px 6px; border:1px solid; background:#fff; }
  .stability-chip.blue { color:var(--blue); border-color:#8aa9dc; }
  .stability-chip.aqua { color:var(--aqua); border-color:#79b8c5; border-style:double; }
  .stability-chip.green { color:var(--green); border-color:#8bc596; }
  .stability-chip.amber { color:var(--orange); border-color:#d8b36f; }
  .stability-chip.red, .stability-chip.red-partial { color:var(--red); border-color:#e18b98; }
  .stability-chip.pending, .stability-chip.short { color:#687384; border-color:#aeb6c4; }
  .badges { position:absolute; top:10px; right:12px; display:flex; gap:4px; }
  .badge { font-size:10px; border-radius:4px; padding:1px 6px; background:#eef3fb; color:#3a5680; border:1px solid #dde6f5; }
  .badge-low { background:#e9f1ff; color:#1d6fd6; border-color:#c8ddfa; }
  .scorebar { position:relative; height:16px; background:#eceff5; border-radius:8px; margin-top:8px; overflow:hidden; }
  .scorebar i { display:block; height:100%; background:linear-gradient(90deg,#4d9ce8,#2fae6d); }
  .scorebar span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#1f2430; text-shadow:0 0 3px #fff,0 0 3px #fff; }
  /* 保有中テーブル */
  table.hold { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:12px; box-shadow:var(--shadow); }
  table.hold th, table.hold td { border-bottom:1px solid var(--line); padding:9px 10px; text-align:left; font-size:13.5px; }
  table.hold tr:last-child td { border-bottom:none; }
  table.hold th { color:var(--muted); font-size:12px; background:#f8fafc; }
  table.hold input { width:110px; background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  .secbar { display:flex; height:26px; border-radius:8px; overflow:hidden; margin:8px 0 20px; border:1px solid var(--line); }
  .secbar div { display:flex; align-items:center; justify-content:center; font-size:10.5px; white-space:nowrap; overflow:hidden; color:#fff; font-weight:600; }
  /* 注意ボックス */
  .box { border-radius:10px; padding:10px 12px; margin-top:8px; font-size:13px; border:1px solid; }
  .box .ttl { display:block; margin-bottom:2px; }
  .box.warn { background:#fff8ea; border-color:#f2dfb4; color:#8a5b06; }
  .box.danger { background:#fdf0f2; border-color:#f4ccd4; color:#a3122b; }
  .box.info { background:#eef4fd; border-color:#cfdff7; color:#1a5399; }
  .kome { color:var(--muted); font-size:11.5px; margin-top:6px; }
  /* モーダル */
  .overlay { display:none; position:fixed; inset:0; background:rgba(25,32,48,.42); z-index:50; overflow-y:auto; padding:24px 12px; }
  .modal { max-width:640px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 12px 40px rgba(20,30,60,.18); }
  .modal.sim-modal { max-width:980px; }
  .modal h2 { font-size:18px; }
  .modal h3 { font-size:14px; margin:16px 0 6px; color:#42506b; border-bottom:1px solid var(--line); padding-bottom:4px; }
  .modal .close { float:right; cursor:pointer; font-size:20px; color:var(--muted); }
  .tagbtns { display:flex; gap:8px; margin:10px 0; }
  .tagbtn { border:1px solid var(--line); background:var(--field); color:var(--muted); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; }
  .tagbtn.on { background:#e7f6ed; color:#0f7a45; border-color:#a7ddbe; font-weight:600; }
  .kv { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; font-size:13.5px; }
  .kv div span { color:var(--muted); font-size:11.5px; display:block; }
  .posbar { position:relative; height:10px; background:linear-gradient(90deg,#4d9ce8,#2fae6d,#e2566c); border-radius:5px; margin:6px 0 2px; }
  .posbar i { position:absolute; top:-4px; width:4px; height:18px; background:#1f2430; border-radius:2px; box-shadow:0 0 0 1px #fff; }
  .poslbl { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; }
  .modal input, .modal textarea { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font-size:13px; width:100%; }
  .divtable { width:100%; border-collapse:collapse; margin-top:7px; font-size:12.5px; }
  .divtable th, .divtable td { border-bottom:1px solid var(--line); padding:5px 7px; }
  .divtable th { color:var(--muted); font-size:11.5px; text-align:left; }
  .mform { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .btn { background:var(--blue); border:1px solid var(--blue); color:#fff; border-radius:8px; padding:7px 16px; cursor:pointer; font-size:13.5px; margin-top:10px; }
  .btn:hover { background:#1a62bd; }
  .btn.sub { background:var(--card); border-color:var(--line); color:var(--text); }
  .btn.sub:hover { background:#f1f4f9; }
  .buyjudge { border-radius:8px; padding:8px 12px; margin-top:6px; font-size:13px; background:#f6f8fb; border:1px solid var(--line); }
  a { color:var(--blue); }
  .err { color:var(--red); }
  .hold-note { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:#eef4fd; border:1px solid #cfdff7; border-radius:10px; padding:10px 12px; margin-bottom:12px; color:#1a5399; }
  .hold-note .btn { margin-top:0; white-space:nowrap; }
  .sim-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:12px; }
  .sim-panel { border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--field); }
  .sim-panel h3 { margin-top:0; }
  .sim-inputs { display:grid; grid-template-columns:minmax(180px,1fr) 150px auto; gap:8px; align-items:end; }
  .sim-inputs label { color:var(--muted); font-size:11.5px; }
  .sim-inputs select { width:100%; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; }
  .sim-metrics { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:10px; }
  .sim-metric { border:1px solid var(--line); border-radius:8px; background:var(--card); padding:9px; }
  .sim-metric span { display:block; color:var(--muted); font-size:11px; }
  .sim-metric b { font-size:15px; }
  .sim-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12.5px; }
  .sim-table th,.sim-table td { border-bottom:1px solid var(--line); padding:7px 6px; text-align:left; }
  .sim-table th { color:var(--muted); font-size:11.5px; }
  .sim-delta.up { color:var(--red); } .sim-delta.down { color:var(--blue); }
  @media(max-width:700px){ .sim-grid{grid-template-columns:1fr}.sim-inputs{grid-template-columns:1fr 1fr}.sim-inputs .btn{grid-column:1/-1}.sim-metrics{grid-template-columns:1fr}.mode-steps{grid-template-columns:1fr 1fr} }
  /* 財務8項目テーブル */
  .f8note { font-size:11.5px; color:var(--muted); margin:2px 0 8px; }
  .f8row { border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:7px; background:var(--field); }
  .f8head { display:flex; align-items:center; gap:8px; }
  .f8head b { font-size:13.5px; flex:1; }
  .f8j { font-size:15px; font-weight:700; width:24px; text-align:center; border-radius:6px; flex:none; }
  .j-o { color:#0f8a4d; background:#e7f6ed; }
  .j-t { color:#c07208; background:#fff4e2; }
  .j-x { color:#d92d43; background:#fdeef0; }
  .j-n { color:var(--muted); background:#eef0f4; font-size:11px; }
  .f8detail { font-size:12.5px; color:#3a4152; margin-top:5px; line-height:1.65; }
  .f8crit { margin-top:6px; }
  .f8crit summary { font-size:11.5px; color:var(--blue); cursor:pointer; list-style:none; display:inline-block; }
  .f8crit summary::-webkit-details-marker { display:none; }
  .f8crit summary::before { content:"▶ "; font-size:9px; }
  .f8crit[open] summary::before { content:"▼ "; }

<script>
"use strict";
let DATA = null, TAB = "all", FIL_HOLD = null, FIL_LOW = false;
const FIL_BORDERS = new Set();
const $ = id => document.getElementById(id);
const LS = {
  get:(k,d=null)=>{ const v=localStorage.getItem(k); return v===null?d:v; },
  set:(k,v)=>localStorage.setItem(k,v),
  del:k=>localStorage.removeItem(k)
};
const fmt = (v,n=2)=> (v===null||v===undefined||isNaN(v)) ? "-" : Number(v).toLocaleString("ja-JP",{maximumFractionDigits:n});
const yen = v => v===null||v===undefined ? "-" : "¥"+fmt(v,0);

/* ---------- データ整形 ---------- */
function manual(code){ try{ return JSON.parse(LS.get("manual_"+code,"{}")); }catch(e){ return {}; } }
function eff(s){ return Object.assign({}, s, manual(s.code)); }
function yieldOf(s){
  const e = eff(s);
  const y = e.yield_pct;
  if (y===null||y===undefined) return null;
  if (y>=20) return "anomaly"; // 利回り20%以上はデータ異常
  return y;
}
function currentYear(){ return DATA && DATA.updated ? DATA.updated.slice(0,4) : String(new Date().getFullYear()); }
function divConfirmed(s){
  // 進行中の年を除いた確定配当。旧データにdiv_confirmedが無い場合はdiv_by_yearから作る
  const e = eff(s);
  if (e.div_confirmed) return e.div_confirmed;
  const by = e.div_by_year || {}, cy = currentYear();
  const out={}; Object.keys(by).forEach(y=>{ if(y<cy) out[y]=by[y]; });
  return out;
}
function divTrend(s){
  const by = divConfirmed(s);
  const years = Object.keys(by).sort().slice(-3);
  if (years.length<2) return false;
  for(let i=1;i<years.length;i++){ if(by[years[i]] < by[years[i-1]]) return false; }
  return by[years[years.length-1]]>0;
}
/* 配当の安定性：2008年以降を基本に、確認期間が短い銘柄は評価しない */
const DIV_START_YEAR = 2008;
const DIV_MIN_YEARS = 10;
function divHistory(s){
  const adjusted = (window.DIV_ADJUSTED||{})[s.code];
  if (adjusted && adjusted.history) {
    const cy = Number(currentYear());
    return Object.keys(adjusted.history).map(y=>({year:String(y),value:Number(adjusted.history[y])}))
      .filter(x=>Number(x.year)<cy && Number.isFinite(x.value))
      .sort((a,b)=>a.year.localeCompare(b.year)).slice(-20);
  }
  const e = eff(s);
  let by = e.div_confirmed || e.div_by_year || {};
  // 更新データによっては日付ごとの履歴（div_hist）のみの場合があるため、年度合計に補正
  if (!Object.keys(by).length && Array.isArray(e.div_hist)) {
    by = {};
    e.div_hist.forEach(x=>{
      const y=String(x.date||"").slice(0,4), v=Number(x.amount);
      if (y.length===4 && Number.isInteger(Number(y)) && Number.isFinite(v)) by[y]=(by[y]||0)+v;
    });
  }
  return Object.keys(by).map(y=>({year:String(y), value:Number(by[y])}))
    .filter(x=>x.year.slice(0,4).length===4 && Number.isInteger(Number(x.year.slice(0,4))) && Number(x.year.slice(0,4))>=DIV_START_YEAR && Number.isFinite(x.value))
    .sort((a,b)=>a.year.localeCompare(b.year)).slice(-20);
}
function dividendCutCount(s, history){
  const review=(window.DIV_ADJUSTED||{})[s.code];
  if(review && Number.isFinite(Number(review.confirmed_real_cuts))) return Number(review.confirmed_real_cuts);
  const dv = divVerified(s.code);
  if (dv && Array.isArray(dv.cuts)) return dv.cuts.length;
  let cuts=0;
  for(let i=1;i<history.length;i++) if(history[i].value < history[i-1].value) cuts++;
  return cuts;
}
function dividendStability(s){
  const history=divHistory(s);
  const review=(window.DIV_ADJUSTED||{})[s.code];
  // 枠色は「減配回数」、確認範囲はラベルと線種で分ける。情報不足を減配なしとは扱わない。
  if(!review)
    return {key:"pending", label:"確認中：調整データなし", history:history, cuts:null, coverage:"unknown"};
  const firstYear=history.length ? Number(history[0].year.slice(0,4)) : null;
  const longCoverage=history.length>=DIV_MIN_YEARS && firstYear<=2009;
  const midCoverage=history.length>=DIV_MIN_YEARS && firstYear>2009;
  const cuts=dividendCutCount(s,history);
  if(cuts>=2) return {key:longCoverage?"red":"red-partial", label:longCoverage?"複数回減配・要注意":"複数回減配（期間不足）・要注意", history:history, cuts:cuts, coverage:longCoverage?"long":"partial"};
  if(cuts===1) return {key:longCoverage?"green":"amber", label:longCoverage?"減配1回":"減配1回（期間不足）", history:history, cuts:cuts, coverage:longCoverage?"long":"partial"};
  if(longCoverage && review.status==="blue_ok") return {key:"blue", label:review.method?"減配なし（調整後）":"減配なし", history:history, cuts:cuts, coverage:"long"};
  if(midCoverage && review.status==="blue_ok") return {key:"aqua", label:"減配なし（2010年以降）", history:history, cuts:cuts, coverage:"partial"};
  if(history.length<DIV_MIN_YEARS) return {key:"short", label:"確認不足（10年未満）", history:history, cuts:cuts, coverage:"short"};
  return {key:"pending", label:"調整確認中（減配判定保留）", history:history, cuts:cuts, coverage:"partial"};
}
const DIVIDEND_FILTER_LABELS={
  blue:"青｜長期・減配なし", aqua:"水色｜減配なし・2010年以降", green:"緑｜減配1回・長期", amber:"黄｜減配1回・期間不足",
  red:"赤｜複数減配・長期", "red-partial":"赤点線｜複数減配・期間不足", pending:"枠なし｜確認中", short:"枠なし｜短期"
};
function refreshDividendFilterCounts(){
  if(!DATA) return;
  const counts={};
  DATA.stocks.filter(s=>!s.error).forEach(s=>{ const key=dividendStability(s).key; counts[key]=(counts[key]||0)+1; });
  document.querySelectorAll("#borderFilter button[data-border]").forEach(btn=>{
    const key=btn.dataset.border;
    btn.innerHTML=`${DIVIDEND_FILTER_LABELS[key]} <small>${counts[key]||0}</small>`;
  });
}
function dividendSparkline(history, color){
  if(!history || history.length<2) return "<div class=\"kome\">配当グラフ：確認できる履歴が不足しています</div>";
  const w=260,h=34,p=3, vals=history.map(x=>x.value), min=Math.min(...vals), max=Math.max(...vals), span=max-min||1;
  const points=history.map((x,i)=>{
    const px=p+(w-p*2)*(i/(history.length-1));
    const py=h-p-(h-p*2)*((x.value-min)/span);
    return [px,py];
  });
  const path=points.map((pt,i)=>(i?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  const dots=points.map(pt=>`<circle cx=\"${pt[0].toFixed(1)}\" cy=\"${pt[1].toFixed(1)}\" r=\"1.8\" fill=\"${color}\"/>`).join("");
  return `<svg class=\"divspark\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"${history[0].year}年から${history[history.length-1].year}年までの配当推移\"><path d=\"${path}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>${dots}</svg>`;
}
function dividendHistoryCard(s){
  const st=dividendStability(s), color={blue:"#0b3d91",aqua:"#007f9e",green:"#2f8f3e",amber:"#b86b00",red:"#c6283d","red-partial":"#c6283d",pending:"#687384",short:"#9aa3b2"}[st.key]||"#9aa3b2";
  const h=st.history;
  if(!h.length) return `<div class=\"divtrend\"><div class=\"divtrend-head\"><span class=\"divtrend-label\">配当推移</span><span>確認不足</span></div></div>`;
  const mark={blue:"◆",aqua:"◇",green:"●",amber:"▲",red:"■","red-partial":"■",pending:"□",short:"□"}[st.key]||"□";
  return `<div class=\"divtrend\"><div class=\"divtrend-head\"><span class=\"divtrend-label b-${st.key}\">${mark} ${st.label}</span><span>${h.length}年分</span></div>${dividendSparkline(h,color)}<div class=\"divtrend-foot\"><span>${h[0].year.slice(0,4)}年 ${fmt(h[0].value,0)}円</span><span>${h[h.length-1].year.slice(0,4)}年 ${fmt(h[h.length-1].value,0)}円</span></div></div>`;
}
function isGrowingDividend(s){
  // 過去10年で概ね増配基調か（成長企業は過去平均が低いので「割安」に見えてしまうため区別する）
  const by = divConfirmed(s);
  const years = Object.keys(by).sort().slice(-10);
  if (years.length<5) return false;
  let downs=0;
  for(let i=1;i<years.length;i++){ if(by[years[i]] < by[years[i-1]]) downs++; }
  return by[years[years.length-1]] > by[years[0]]*1.5 && downs<=2;
}
/* IR BANK 8項目チェックリスト（学長マガジン準拠）：各1点で合計8点満点 */
function histTrendUp(hist){
  // 直近値が最初の値を上回り、かつ下落年が1回以下なら「右肩上がり」とみなす
  if (!hist || hist.length<2) return false;
  let downs=0;
  for(let i=1;i<hist.length;i++){ if(hist[i].value < hist[i-1].value) downs++; }
  return hist[hist.length-1].value > hist[0].value && downs<=1;
}
function scoreItems(s){
  const e = eff(s);
  return [
    ["売上高トレンド", histTrendUp(e.revenue_hist)],
    ["EPSトレンド", histTrendUp(e.eps_hist)],
    ["営業利益率10%以上", e.op_margin!==null && e.op_margin>=10],
    ["自己資本比率40%以上", e.equity_ratio!==null && e.equity_ratio>=40],
    ["営業CF黒字・増加", e.op_cf_hist && e.op_cf_hist.every(x=>x.value>0) && histTrendUp(e.op_cf_hist)],
    ["配当安定・増配", divTrend(s)],
    ["配当性向30〜50%", e.payout!==null && e.payout>=30 && e.payout<=50],
    ["現金増加トレンド", histTrendUp(e.cash_hist)],
  ];
}
/* ---------- 財務8項目：IR BANK長期調査データ（financial8_verified.json）を正とする ----------
   項目名と「判定の基準」。基準は両学長の「優良企業を見分ける財務指標8選」に準拠。 */
const F8_META = {
  sales:            ["売上高トレンド", "右肩上がりが理想です。商売そのものが伸びているかを見ます。売上が伸びていない会社は、将来の増配も期待しにくくなります。"],
  eps:              ["EPSトレンド", "右肩上がりが理想です。EPS＝1株あたりの利益で、株価の基準になる最重要指標です。"],
  operating_margin: ["営業利益率", "10%以上が目安です。上場企業の平均は7〜8%で、10%を超えていると価格競争ではなく付加価値で稼げている可能性が高いと見ます。"],
  equity_ratio:     ["自己資本比率", "40%以上が目安です。総資産のうち返済の必要がない自分のお金の割合で、高いほど潰れにくい会社といえます。"],
  operating_cf:     ["営業CF（営業キャッシュフロー）", "黒字かつ増加傾向が理想です。帳簿上の利益ではなく、本業で実際に現金が入ってきているかを見ます。ただし工事・建設など業種によっては赤字の年が出ることもあります。"],
  dividend:         ["配当（減配なし・増配）", "減配がなく右肩上がりが理想です。不況でも配当を守ってきた会社は、株主を大切にする経営姿勢の表れと見ます。"],
  payout_ratio:     ["配当性向", "30〜50%が目安です。高すぎる（70%超など）と無理をして配当を出していて将来の減配リスク、低すぎると株主還元が物足りない、と判断します。"],
  cash:             ["現金等", "増加傾向が理想です。現金が潤沢な会社は、不況や急な出来事が起きても配当を払い続ける体力があります。"],
};
function fin8(code){ const F = window.FIN8; return (F && F.stocks) ? F.stocks[code] : null; }
function fin8Counts(code){
  const f = fin8(code); if (!f || !f.items) return null;
  const c = {"○":0,"△":0,"×":0,"不明":0,"対象外":0};
  Object.keys(f.items).forEach(k=>{ const j=f.items[k].judge; if (c[j]!==undefined) c[j]++; });
  return c;
}
function isExempt(code){ const c = fin8Counts(code); return !!c && c["対象外"] >= 8; }
function qualityScore(s){
  const c = fin8Counts(s.code);
  if (c) return c["対象外"] >= 8 ? 0 : c["○"];   // 調査データがあればそれを正とする（○の数）
  return scoreItems(s).filter(x=>x[1]).length;   // 調査データが無い銘柄のみ、従来の自動判定にフォールバック
}
/* スコアバーの色：段階ごとに変わる（グラデーションではなく一目で分かる色分け） */
function scoreColor(sc){
  if (sc<=3) return "#d92d43";  // 赤
  if (sc<=5) return "#f5a623";  // オレンジ〜黄色
  if (sc===6) return "#22c55e"; // 緑
  if (sc===7) return "#3b82f6"; // 青
  return "#174ea6";             // 濃い青（8点）
}

/* 罠銘柄診断：利益・配当の変動性（変動係数）が高いのに利回りだけ高い銘柄を検知 */
function coefVar(hist){
  const vals = (hist||[]).map(x=>x.value).filter(v=>v!==null && v!==undefined);
  if (vals.length<3) return null;
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  if (!mean) return null;
  const variance = vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;
  return Math.sqrt(variance)/Math.abs(mean);
}
function trapWarning(s){
  const e = eff(s), y = yieldOf(s);
  if (y==="anomaly"||y===null||y<4) return null; // 4%未満は対象外
  const reasons = [];

  // ① EPS赤字の年がある（最優先の危険信号）
  const eps = (e.eps_hist||[]).map(x=>x.value);
  if (eps.some(v=>v<0)) reasons.push("過去にEPS赤字の年があります");

  // ② EPSの振れ幅が大きい（景気敏感株の典型）
  const cvEps = coefVar(e.eps_hist);
  if (cvEps!==null && cvEps>0.5) reasons.push("利益の年ごとの振れ幅が大きいです");

  // ③ 減配の履歴がある（増配基調の企業は対象外にする）
  if (!isGrowingDividend(s)){
    const by = divConfirmed(s);
    const years = Object.keys(by).sort().slice(-6);
    let downs=0;
    for(let i=1;i<years.length;i++){ if(by[years[i]] < by[years[i-1]]*0.9) downs++; } // 1割超の減配のみカウント
    if (downs>=2) reasons.push("過去に複数回の減配があります");
  }

  if (!reasons.length) return null;
  return `利回り${fmt(y)}%と高めですが、${reasons.join("／")}。学長マガジンでいう「罠銘柄」の可能性があるため、業績の安定性を必ず確認してください。`;
}
function top30Score(s){
  const y = yieldOf(s);
  if (y==="anomaly"||y===null) return null; // 異常値はランク対象外
  const e = eff(s);
  let sc = Math.min(y/5*40, 40);            // 利回り点 最大40
  sc += qualityScore(s)/8*35;               // 財務点 最大35
  const pbr = e.pbr;
  sc += pbr===null?0 : pbr<0.5?15 : pbr<0.8?12 : pbr<1.0?9 : pbr<1.5?5 : 0;
  const per = e.per;
  sc += per===null?0 : per<10?10 : per<15?7 : per<20?4 : 0;
  return Math.round(sc*10)/10;
}
function pos52(s){
  const e = eff(s);
  if (!e.price||!e.high52||!e.low52||e.high52<=e.low52) return null;
  return (e.price-e.low52)/(e.high52-e.low52)*100;
}
function tagOf(code){
  if (LS.get("holding_"+code)) return "holding";
  if (LS.get("watch_"+code)) return "watch";
  if (LS.get("candidate_"+code)) return "candidate";
  return null;
}

/* ---------- フィルター＆描画 ---------- */
const TABS = [["all","全銘柄"],["y4","4%以上"],["y37","3.7%以上"],["holding","保有中"],["watch","ウォッチ"],["candidate","候補"],["top30","トップ30"],["error","エラー"]];
function filtered(){
  let list = DATA.stocks.slice();
  const sec=$("secSel").value, smin=+$("scoreSel").value, q=$("q").value.trim().toLowerCase();
  if (TAB==="error") list = list.filter(s=>s.error || yieldOf(s)==="anomaly");
  else {
    list = list.filter(s=>!s.error);
    if (TAB==="y4") list = list.filter(s=>{const y=yieldOf(s); return y!=="anomaly"&&y>=4;});
    if (TAB==="y37") list = list.filter(s=>{const y=yieldOf(s); return y!=="anomaly"&&y>=3.7;});
    if (["holding","watch","candidate"].includes(TAB)) list = list.filter(s=>LS.get(TAB+"_"+s.code));
    if (TAB==="top30") list = list.filter(s=>top30Score(s)!==null).sort((a,b)=>top30Score(b)-top30Score(a)).slice(0,30);
  }
  if (sec) list = list.filter(s=>eff(s).sector===sec);
  if (smin) list = list.filter(s=>qualityScore(s)>=smin);
  if (q) list = list.filter(s=>(s.name||"").toLowerCase().includes(q)||s.code.includes(q));
  if (FIL_HOLD===true) list = list.filter(s=>LS.get("holding_"+s.code));
  if (FIL_HOLD===false) list = list.filter(s=>!LS.get("holding_"+s.code));
  if (FIL_LOW) list = list.filter(s=>{ const p=pos52(s); return p!==null&&p<=33; });
  if (FIL_BORDERS.size) list = list.filter(s=>FIL_BORDERS.has(dividendStability(s).key));
  const key=$("sort").value;
  if (TAB!=="top30") list.sort((a,b)=>{
    const ya=yieldOf(a), yb=yieldOf(b);
    if (key==="yield") return (yb==="anomaly"?-1:yb??-1)-(ya==="anomaly"?-1:ya??-1);
    if (key==="score") return qualityScore(b)-qualityScore(a);
    if (key==="price") return (eff(b).price??0)-(eff(a).price??0);
    return a.code.localeCompare(b.code);
  });
  return list;
}

const SECTOR_DEFENSIVE = {"生活必需品":"defensive","ヘルスケア":"defensive","公益事業":"defensive","通信サービス":"defensive",
  "資本財":"cyclical","一般消費財":"cyclical","素材":"cyclical","エネルギー":"cyclical","金融":"cyclical"};

function holdTable(list){
  const bulkBtns = `<div style="margin-bottom:10px">

  if (!list.length) return bulkBtns+`<div style="color:var(--muted);margin-bottom:12px">「保有中」タグの銘柄がありません。上のボタンで一括設定できます。</div>`;
  let total=0;
  const rows = list.map(s=>{
    const inv=+LS.get("invest_"+s.code,0)||0; total+=inv; return {s,inv};
  });
  const trs = rows.map(({s,inv})=>{
    const pct = total>0? inv/total*100 : 100/rows.length;
    const buyP = +LS.get("buyprice_"+s.code,0)||0;
    return `<tr><td><a href="#" onclick="openModal('${s.code}');return false" style="color:var(--text)">${s.name}</a><br><span style="color:var(--muted);font-size:11px">${s.code}</span></td>

  }).join("");
  const useAmt = total>0;

  // ① セクター10%目安チェック
  const bySec={};
  rows.forEach(({s,inv})=>{ const k=eff(s).sector||"その他"; bySec[k]=(bySec[k]||0)+(useAmt?inv:1); });
  const secTotal=Object.values(bySec).reduce((a,b)=>a+b,0)||1;
  const colors=["#2f7ed8","#1f9a63","#d1810f","#d24358","#7b62cc","#1f97ad","#a8891a"];
  const secOver = Object.entries(bySec).filter(([k,v])=>v/secTotal*100>10).map(([k,v])=>`${k}(${fmt(v/secTotal*100,0)}%)`);
  const bar = Object.entries(bySec).map(([k,v],i)=>
    `<div style="width:${v/secTotal*100}%;background:${colors[i%colors.length]}" title="${k}">${k} ${fmt(v/secTotal*100,0)}%</div>`).join("");

  // ② 配当集中3%上限チェック（投資額×利回りで配当額を概算）
  const divRows = rows.map(({s,inv})=>{ const y=yieldOf(s); return {s, div: (useAmt&&y!=="anomaly"&&y!==null)? inv*y/100 : 0}; });
  const totalDiv = divRows.reduce((a,r)=>a+r.div,0);
  const divOver = totalDiv>0 ? divRows.filter(r=>r.div/totalDiv*100>3).map(r=>`${r.s.name}(${fmt(r.div/totalDiv*100,0)}%)`) : [];

  // ③ ディフェンシブ50%下限チェック
  let defAmt=0;
  rows.forEach(({s,inv})=>{ if(sectorType(eff(s).sector)==="defensive") defAmt += useAmt?inv:1; });
  const defPct = defAmt/secTotal*100;

  // ⑤ 買い増し基準（買うたびに前回購入価格を更新）
  const nanpinRows = rows.filter(({s})=>{
    const bp=+LS.get("lastbuyprice_"+s.code,0); return bp>0;
  }).map(({s})=>{
    const bp=+LS.get("lastbuyprice_"+s.code,0), cur=eff(s).price;
    const chg = cur? (cur/bp-1)*100 : null;
    let msg=null;
    if (chg!==null){
      if (chg<=-20) msg="前回購入価格から-20%：業績・配当を再確認";
    }
    return msg? `${s.name}：${fmt(chg,1)}%（${msg}）` : null;
  }).filter(Boolean);

  let warnings = "";
  if (secOver.length) warnings += `<div class="box warn"><b class="ttl">⚠️ セクター10%目安超</b>${secOver.join("、")}。平常時の新規買付で少しずつ整える目安です。</div>`;
  if (divOver.length) warnings += `<div class="box warn"><b class="ttl">⚠️ 配当集中3%超</b>${divOver.join("、")}。この銘柄が減配すると家計への影響が大きくなります。</div>`;
  if (nanpinRows.length) warnings += `<div class="box info"><b class="ttl">📉 20%基準到達・要確認</b>${nanpinRows.join("<br>")}</div>`;

  return bulkBtns+`<table class="hold"><tr><th>銘柄</th><th>セクター</th><th>投資額</th><th>割合</th><th>購入単価</th></tr>${trs}
    <tr><td colspan="2"><b>投資合計</b></td><td colspan="3"><b>${yen(total)}</b></td></tr></table>
    ${warnings}
    <div class="lbl" style="color:var(--muted);font-size:12px">セクター割合（${useAmt?"金額ベース":"件数ベース"}）／ ディフェンシブ比率 ${useAmt?fmt(defPct,0)+"%":"-"}（参考表示）</div>
    <div class="secbar">${bar}</div>`;
}

  }
  const c = fin8Counts(code);
  if (c["対象外"] >= 8){
    return `<h3>財務8項目</h3>
      <div class="f8note">${f.score || "ETFのため財務8指標による評価はできません"}</div>`;
  }
  const order = (window.FIN8 && window.FIN8.order) || Object.keys(f.items);
  const jcls = j => j==="○" ? "j-o" : j==="△" ? "j-t" : j==="×" ? "j-x" : "j-n";
  const rows = order.filter(k=>f.items[k]).map(k=>{
    const it = f.items[k], meta = F8_META[k] || [k, ""];
    return `<div class="f8row">
      <div class="f8head"><b>${meta[0]}</b><span class="f8j ${jcls(it.judge)}">${it.judge||"-"}</span></div>
      <div class="f8detail">${it.detail||"（根拠データなし）"}</div>
      ${meta[1] ? `<details class="f8crit"><summary>判定の基準を見る</summary><p>${meta[1]}</p></details>` : ""}
    </div>`;
  }).join("");
  const spanNote = (f.span!==null && f.span!==undefined && f.span < 15)
    ? `⚠️ この銘柄はIR BANKで遡れるデータが<b>${f.span}年分</b>にとどまります（${f.years}）。上場から日が浅いなどの理由で、他の銘柄の15〜20年分の判定とは重みが異なる点にご注意ください。`
    : `IR BANKの長期データ（${f.years}）にもとづく判定です。`;
  return `<h3>財務8項目　<span style="font-weight:400;font-size:12.5px">${c["○"]}/8（○${c["○"]} △${c["△"]} ×${c["×"]}${c["不明"]?" 不明"+c["不明"]:""}）</span></h3>
    <div class="f8note">${spanNote}　調査時点：${(window.FIN8&&window.FIN8.generated_at)||"-"}（株価と違い自動更新されません）</div>
    ${rows}`;
}
function timingRow(label, cur, avg, lowerIsCheap){
  if (cur===null||cur===undefined||avg===null||avg===undefined) return `<div><span>${label}</span><b>-</b></div>`;
  // 利回りは高い方が割安、PER/PBRは低い方が割安（lowerIsCheap=trueで判定反転）
  const cheap = lowerIsCheap ? cur < avg : cur > avg;
  const cls = cheap ? "c-green" : "c-red";
  const word = cheap ? "割安" : "割高";
  return `<div><span>${label}（現在 / 10年平均）</span><b class="${cls}">${fmt(cur)} / ${fmt(avg)}（${word}）</b></div>`;
}
function timingPanel(s){
  const e = eff(s);
  if (!e.hist_years_used) return `<p class="kome">過去データが不足しており、判定できません。</p>`;
  const growNote = isGrowingDividend(s)
    ? `<div class="box warn" style="margin-top:8px"><b class="ttl">📈 増配が続いている銘柄です</b>過去10年で配当を大きく伸ばしているため、過去平均との比較では実態以上に「割安」に見えます。株価が下がったのではなく配当が育った結果なので、PERやPBRもあわせて判断してください。</div>` : "";
  const dataWarn = e.div_warning
    ? `<div class="box danger" style="margin-top:8px"><b class="ttl">⚠️ 配当データ要確認</b>${e.div_warning}</div>` : "";
  return `<div class="kv">
    ${timingRow("配当利回り%", yieldOf(s)==="anomaly"?null:yieldOf(s), e.avg_yield_10y, false)}
    ${timingRow("PER", e.per, e.avg_per_10y, true)}
    ${timingRow("PBR", e.pbr, e.avg_pbr_10y, true)}
  </div>
  ${dataWarn}${growNote}
  <p class="kome">絶対水準ではなく、この銘柄自身の過去${e.hist_years_used}年平均との比較です（学長マガジンより）。株価は年平均で近似、PBRは発行済株式数が過去も一定と仮定した概算値です。株式分割があった銘柄では過去の数値がずれる場合があります。</p>`;
}
function buyJudge(buyY,y){
  if (!buyY) return "購入時の利回りを入力すると、現在との比較を表示します";
  if (y==="anomaly"||y===null) return "現在の利回りが取得できていません";
  const b=+buyY;
  if (y>=b) return `<span class="c-green">現在 ${fmt(y)}% ≧ 購入時 ${fmt(b)}%：購入時より利回りが高く、買い増し検討圏です</span>`;
  return `<span class="c-orange">現在 ${fmt(y)}% ＜ 購入時 ${fmt(b)}%：購入時より株価が上昇（利回り低下）しています</span>`;
}

function portfolioRows(){
  return DATA.stocks.map(s=>{
    const shares=+LS.get("shares_"+s.code,0)||0, e=eff(s);
    return {s,shares,value:shares*(e.price||0),dividend:shares*(e.dividend||0)};
  }).filter(r=>r.shares>0);
}
function simBasket(){ try{ const a=JSON.parse(LS.get("sim_basket","[]")); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function saveSimBasket(a){ LS.set("sim_basket",JSON.stringify(a)); }
function portfolioSummary(rows){
  const value=rows.reduce((n,r)=>n+r.value,0), dividend=rows.reduce((n,r)=>n+r.dividend,0);
  const defensive=rows.filter(r=>sectorType(eff(r.s).sector)==="defensive").reduce((n,r)=>n+r.value,0);
  const stable=rows.filter(r=>dividendStability(r.s).key==="blue").reduce((n,r)=>n+r.value,0);
  return {value,dividend,defensive:value?defensive/value*100:0,stable:value?stable/value*100:0};
}
function projectedRows(){
  const byCode={};
  portfolioRows().forEach(r=>byCode[r.s.code]=Object.assign({},r));
  simBasket().forEach(x=>{
    const s=DATA.stocks.find(v=>v.code===x.code), amount=+x.amount||0; if(!s) return;
    const e=eff(s), add=e.price?Math.floor(amount/e.price):0;
    if(!byCode[s.code]) byCode[s.code]={s,shares:0,value:0,dividend:0};
    byCode[s.code].shares+=add;
    byCode[s.code].value+=add*(e.price||0);
    byCode[s.code].dividend+=add*(e.dividend||0);
  });
  return Object.values(byCode).filter(r=>r.shares>0);
}
function metricHtml(label,before,after,suffix=""){
  return `<div class="sim-metric"><span>${label}</span><b>${before} → ${after}${suffix}</b></div>`;
}

    const s=DATA.stocks.find(v=>v.code===x.code); if(!s) return "";

  const sectors=[...new Set([...Object.keys(sectorBefore),...Object.keys(sectorAfter)])].sort((x,y)=>(sectorAfter[y]||0)-(sectorAfter[x]||0));
  const secRows=sectors.map(k=>{
    const bp=b.value?(sectorBefore[k]||0)/b.value*100:0, ap=a.value?(sectorAfter[k]||0)/a.value*100:0, d=ap-bp;
    return `<tr><td>${k}</td><td>${fmt(bp,1)}%</td><td>${fmt(ap,1)}%</td><td class="sim-delta ${d>0.05?'up':d<-.05?'down':''}">${d>=0?'+':''}${fmt(d,1)}pt</td></tr>`;

  const imported=LS.get("portfolio_imported_at","");

  const concentration=after.filter(r=>a.dividend&&r.dividend/a.dividend*100>3).sort((x,y)=>y.dividend-x.dividend).slice(0,6);
  const notices=[];

  if(sectorOver.length) notices.push("購入後にセクター10%を超える: "+sectorOver.join("、"));
  if(concentration.length) notices.push("参考・購入後の配当割合が3%を超える: "+concentration.map(r=>`${r.s.name} ${fmt(r.dividend/a.dividend*100,1)}%`).join("、"));
  $("modal").innerHTML=`
    <span class="close" onclick="closeModal()">✕</span><h2>🧮 購入シミュレーター</h2>
    <p class="kome">実際の注文は行いません。表示時点の株価・年間配当で、購入後の偏りを試算します。保有数などはこのブラウザ内だけに保存されます。</p>
    <div class="box ${crash?'danger':'info'}"><b class="ttl">${crash?'暴落時モード':'平常時モード'}</b>${crash?'銘柄3%・セクター10%の超過は事実として表示しますが、暴落中の一時的な偏りは許容し、平常時の新規買付で戻します。':'銘柄2〜3%・セクター10%を目安に、新しい買付で偏りを整えます。厳密な上限ではなく確認の目安です。'}</div>
    <div class="sim-grid">
      <div class="sim-panel"><h3>① 現在のポートフォリオ</h3><p><b>${base.length}銘柄</b>${imported?` ／ 取込 ${new Date(imported).toLocaleString('ja-JP')}`:" ／ 未取込"}</p><button class="btn sub" onclick="openPortfolioImport()">管理シートのデータを取り込む</button></div>
      <div class="sim-panel"><h3>② 今回分だけを追加</h3><div class="sim-inputs"><label>銘柄<select id="simCode">${options}</select></label><label>今回の予算（円）<input id="simAmount" type="number" min="0" step="1000" placeholder="例：100000"></label><button class="btn" onclick="addSimItem()">追加</button></div><p class="kome">暴落時は予定総額を2〜3回に分け、この画面には今回使う分だけを入れます。</p></div>
    </div>
    <h3>購入予定</h3>${basket.length?`<div class="tblwrap"><table class="sim-table"><tr><th>銘柄</th><th>予算</th><th>概算株数</th><th>概算購入額</th><th>年間配当</th><th></th></tr>${planRows}</table></div><button class="btn sub" onclick="clearSimBasket()">購入予定をすべて消す</button>`:'<p class="kome">まだ追加されていません。1回の購入で複数銘柄をまとめて比較できます。</p>'}
    <h3>③ 購入前 → 購入後</h3><div class="sim-metrics">
      ${metricHtml("時価評価額",yen(b.value),yen(a.value))}
      ${metricHtml("予想年間配当",yen(b.dividend),yen(a.dividend))}
      ${metricHtml("ディフェンシブ比率",fmt(b.defensive,1)+"%",fmt(a.defensive,1),"%")}
      ${metricHtml("青枠（減配なし）比率",fmt(b.stable,1)+"%",fmt(a.stable,1),"%")}
    </div>
    ${notices.length?`<div class="box ${crash?'info':'warn'}"><b class="ttl">${crash?'一時的な偏りを確認':'分散目安を確認'}</b>${notices.join("<br>")}${crash?'<br>基準超過だけで候補を外さず、業績と配当の安全性を優先します。':''}</div>`:""}
    <h3>セクター構成の変化</h3>${sectors.length?`<div class="tblwrap"><table class="sim-table"><tr><th>セクター</th><th>現在</th><th>購入後</th><th>変化</th></tr>${secRows}</table></div>`:'<p class="kome">保有データまたは購入予定を入れると表示されます。</p>'}`;
  $("overlay").style.display="block";
}
function addSimItem(){
  const code=$("simCode").value, amount=+$("simAmount").value;
  if(!amount||amount<=0){ $("simAmount").focus(); return; }

}

function applyBulkPrices(){
  const raw = $("bulkPriceText").value.trim();
  const msgEl = $("bulkPriceMsg");
  if (!raw){ msgEl.innerHTML = '<span class="err">貼り付け欄が空です</span>'; return; }
  let obj;
  try{ obj = JSON.parse(raw); }
  catch(e){ msgEl.innerHTML = '<span class="err">JSONとして読み取れませんでした。形式を確認してください。</span>'; return; }
  // 2つの形式をどちらも受け付ける
  let entries = [];
  if (Array.isArray(obj.stocks)) {
    entries = obj.stocks.map(s=>[s.code, s.avg_price]);
  } else if (typeof obj === "object" && obj !== null) {
    entries = Object.entries(obj).filter(([k])=>k!=="source"&&k!=="note");
  }
  const knownCodes = new Set((DATA?DATA.stocks:[]).map(s=>s.code));
  let applied = 0, unknown = [];
  entries.forEach(([code, price])=>{
    const p = +price;
    if (!code || !p || isNaN(p)) return;
    if (!knownCodes.has(String(code))) { unknown.push(code); return; }
    LS.set("buyprice_"+code, p);
    applied++;
  });
  if (!applied){ msgEl.innerHTML = '<span class="err">反映できる銘柄が見つかりませんでした。</span>'; return; }
  let msg = `<span class="c-green">✅ ${applied}銘柄の取得単価を反映しました</span>`;

  msgEl.innerHTML = msg;
  render();
}

function applyLastPurchasePrices(){

  if(!applied){ msgEl.innerHTML='<span class="err">反映できる前回購入価格がありませんでした。</span>'; return; }

  render();
}

/* ---------- データのバックアップ・復元 ---------- */
// タグ・投資額・取得単価・メモなど、このアプリが使うlocalStorageキーだけを対象にする
const BACKUP_PREFIXES = ["holding_","watch_","candidate_","invest_","buyprice_","lastbuyprice_","lastbuydate_","buy_yield_","manual_","memo_","shares_","sim_"];
const BACKUP_EXACT_KEYS = ["tdr_value","portfolio_imported_at","operation_mode","signal_panic","signal_circuit"];
function isBackupKey(k){ return BACKUP_PREFIXES.some(p=>k.startsWith(p)) || BACKUP_EXACT_KEYS.includes(k); }
function collectBackupData(){
  const data = {};
  Object.keys(localStorage).forEach(k=>{ if (isBackupKey(k)) data[k] = localStorage.getItem(k); });
  return data;
}
function downloadBackup(){
  const data = collectBackupData();
  const json = JSON.stringify({app:"kabu-tracker", exported_at:new Date().toISOString(), data:data});
  const blob = new Blob([json], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "kabu-tracker-backup_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function openBackupModal(){
  const count = Object.keys(collectBackupData()).length;
  $("modal").innerHTML = `
    <span class="close" onclick="closeModal()">✕</span>
    <h2>💾 データのバックアップ・復元</h2>
    <p class="kome" style="margin-top:4px">タグ・投資額・取得単価・メモなどは、すべて<b>このブラウザにだけ</b>保存されています。ファイルに書き出しておけば、他の端末（iPhoneなど）へ同じ内容を復元したり、ブラウザのデータが消えたときに復元したりできます（現在 ${count}件のデータあり）。</p>
    <h3>書き出す</h3>
    <button class="btn" onclick="downloadBackup()">📥 ファイルとしてダウンロード</button>
    <p class="kome">ダウンロードしたファイルは、復元したい端末のブラウザでこの画面を開き、下の「ファイルを選択」から読み込んでください。</p>
    <h3>復元する</h3>
    <input type="file" id="backupFileInput" accept=".json" onchange="handleBackupFile(event)">
    <p class="kome" style="margin-top:6px">他の端末からコピー＆ペーストする場合は、ここにJSONを直接貼り付けても構いません。</p>
    <textarea id="backupImportText" rows="6" placeholder="ここにバックアップJSONを貼り付け" style="font-family:monospace;font-size:12px;margin-top:6px"></textarea>
    <div id="backupMsg" style="margin-top:8px;font-size:13px"></div>
    <button class="btn" onclick="applyBackup()">この内容で復元する</button>
    <button class="btn sub" onclick="closeModal()">閉じる</button>`;
  $("overlay").style.display = "block";
}
function handleBackupFile(ev){
  const file = ev.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { $("backupImportText").value = e.target.result; };
  reader.readAsText(file);
}
function applyBackup(){
  const raw = $("backupImportText").value.trim();
  const msgEl = $("backupMsg");
  if (!raw){ msgEl.innerHTML = '<span class="err">貼り付け欄が空か、ファイルが読み込めていません</span>'; return; }
  let obj;
  try{ obj = JSON.parse(raw); }
  catch(e){ msgEl.innerHTML = '<span class="err">JSONとして読み取れませんでした。ファイルの中身を確認してください。</span>'; return; }
  const data = (obj && typeof obj.data === "object") ? obj.data : obj;
  if (!data || typeof data !== "object"){ msgEl.innerHTML = '<span class="err">データの形式が正しくありません。</span>'; return; }
  const keys = Object.keys(data).filter(isBackupKey);
  if (!keys.length){ msgEl.innerHTML = '<span class="err">復元できるデータが見つかりませんでした。</span>'; return; }
  if (!confirm(`現在このブラウザに保存されているデータ（タグ・投資額・取得単価・メモ等）を、貼り付けた内容（${keys.length}件）で上書きします。よろしいですか？`)) return;
  keys.forEach(k => LS.set(k, data[k]));
  msgEl.innerHTML = `<span class="c-green">✅ ${keys.length}件のデータを復元しました</span>`;
  $("signalPanic").checked=LS.get("signal_panic")==="1";
  $("signalCircuit").checked=LS.get("signal_circuit")==="1";
  renderOperationMode();
  render();
}

/* ---------- 市場環境 ---------- */
let CURRENT_VIX=null;
function vixColor(v){ return v<20?"c-green":v<=30?"c-orange":"c-red"; }
function showVix(v,note){ CURRENT_VIX=+v; $("vix").textContent=fmt(v); $("vix").className=vixColor(v); $("vixNote").textContent=note||""; updateSignalSummary(); }
async function liveVix(){
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),6000); // 6秒タイムアウト
    const url="https://corsproxy.io/?url="+encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/^VIX");
    const r=await fetch(url,{signal:ctl.signal}); clearTimeout(to);
    const j=await r.json();
    const v=j.chart.result[0].meta.regularMarketPrice;
    if (v) showVix(v,"（ライブ）");
  }catch(e){ /* フォールバック: JSON値のまま */ }
}
function tdrView(){
  const v=+LS.get("tdr_value",0);
  $("tdr").value = v||"";
  const el=$("tdrView");
  if(!v){ el.textContent=""; return; }
  el.textContent=v;
  el.className = v>120?"c-red" : v>=70?"c-green" : "c-blue";
}
function operationMode(){ return LS.get("operation_mode","normal")==="crash"?"crash":"normal"; }
function setOperationMode(mode){ LS.set("operation_mode",mode==="crash"?"crash":"normal"); renderOperationMode(); }
function renderOperationMode(){
  const mode=operationMode(), crash=mode==="crash";
  document.querySelectorAll(".mode-btn").forEach(b=>{ const on=b.dataset.mode===mode; b.classList.toggle("on",on); b.setAttribute("aria-pressed",String(on)); });
  $("modeMessage").innerHTML=crash
    ? "<b>暴落時：</b>業績と配当の安全性を確認し、前回購入価格を基準に今回分だけを分割して検討します。底値当てはしません。"
    : "<b>平常時：</b>新規の買付で分散を整え、暴落用の現金を残します。高利回りだけを理由に買いません。";
  const steps=crash
    ? ["業績・減配リスク確認","前回購入価格を確認","今回分を2〜3回に分割","偏りは後から整える"]
    : ["銘柄2〜3%を確認","セクター10%を確認","配当・財務・割安性を確認","暴落用現金を残す"];
  $("modeSteps").innerHTML=steps.map(x=>`<div class="mode-step">${x}</div>`).join("");
  updateSignalSummary();
}
function updateSignalSummary(){
  const vix=Number.isFinite(CURRENT_VIX)&&CURRENT_VIX>=40;
  const panic=LS.get("signal_panic")==="1", circuit=LS.get("signal_circuit")==="1";
  const count=[vix,panic,circuit].filter(Boolean).length;
  const el=$("signalSummary"); if(!el) return;
  el.textContent=`補助サイン ${count}/3${vix?"（VIX 40以上）":""}`;
  el.className="signal-summary "+(count>=2?"c-red":count===1?"c-orange":"");
}

/* ---------- 初期化 ---------- */
async function init(){
  try{
    const r = await fetch("data/stocks.json?t="+Date.now());
    DATA = await r.json();
  }catch(e){
    $("updated").innerHTML='<span class="err">data/stocks.json を読み込めませんでした。Webサーバー経由（GitHub Pages等）で開いてください。</span>';
    return;
  }
  $("updated").textContent = "株価データ更新: "+DATA.updated+"（自動取得・リアルタイムではありません）";
  if (DATA.vix!==null) showVix(DATA.vix,"（"+(DATA.vix_updated||"")+" 時点）");
  liveVix();
  tdrView();
  $("tdr").addEventListener("change",e=>{ LS.set("tdr_value",e.target.value); tdrView(); });
  $("signalPanic").checked=LS.get("signal_panic")==="1";
  $("signalCircuit").checked=LS.get("signal_circuit")==="1";
  $("signalPanic").addEventListener("change",e=>{ e.target.checked?LS.set("signal_panic","1"):LS.del("signal_panic"); updateSignalSummary(); });
  $("signalCircuit").addEventListener("change",e=>{ e.target.checked?LS.set("signal_circuit","1"):LS.del("signal_circuit"); updateSignalSummary(); });
  document.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>setOperationMode(b.dataset.mode)));
  renderOperationMode();
  $("tabs").innerHTML = TABS.map(([k,l])=>`<div class="tab ${k===TAB?"on":""}" data-k="${k}">${l}</div>`).join("");
  $("tabs").addEventListener("click",e=>{
    const k=e.target.dataset.k; if(!k) return;
    TAB=k;
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.k===k));
    render();
  });
  const secs=[...new Set(DATA.stocks.map(s=>s.sector).filter(Boolean))];
  $("secSel").innerHTML += secs.map(s=>`<option>${s}</option>`).join("");
  ["sort","secSel","scoreSel"].forEach(id=>$(id).addEventListener("change",render));
  $("q").addEventListener("input",render);
  $("qf").addEventListener("click",e=>{
    const f=e.target.dataset.f; if(!f) return;
    if (f==="hold") FIL_HOLD = FIL_HOLD===true ? null : true;
    if (f==="unhold") FIL_HOLD = FIL_HOLD===false ? null : false;
    if (f==="low") FIL_LOW = !FIL_LOW;
    document.querySelector('.qf button[data-f="hold"]').classList.toggle("on", FIL_HOLD===true);
    document.querySelector('.qf button[data-f="unhold"]').classList.toggle("on", FIL_HOLD===false);
    document.querySelector('.qf button[data-f="low"]').classList.toggle("on", FIL_LOW);
    render();
  });
  $("borderFilter").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-border]"); if(!btn) return;
    const key=btn.dataset.border;
    if(FIL_BORDERS.has(key)) FIL_BORDERS.delete(key); else FIL_BORDERS.add(key);
    btn.classList.toggle("on",FIL_BORDERS.has(key));
    render();
  });
  render();
}
init();

/* ---------- 追加機能：買い増し発動ライン・配当調査メモ（2026-08-14追加） ---------- */
function triggerInfo(s){
  const e=eff(s);
  const last=+LS.get("lastbuyprice_"+s.code,0)||0;
  let basis,label,kind="candidate",watchBasis=null;
  if (last>0){
    basis=last*0.8; label="20%基準"; kind="holding";
    if(sectorType(e.sector)==="defensive") watchBasis=last*0.9;
  }
  else if (LS.get("holding_"+s.code)){ return {unknown:true,label:"前回購入価格未確認"}; }
  else { basis=e.low52; label="52週安値（補助目安）"; }
  if (!basis||!e.price) return {unknown:true,label:"前回購入価格未確認"};
  const gap=(e.price/basis-1)*100;
  const triggered=e.price<=basis, observing=watchBasis!==null&&e.price<=watchBasis&&!triggered;
  return {basis,label,gap,triggered,observing,watchBasis,kind,last,unknown:false,sectorType:sectorType(e.sector)};
}
function divVerified(code){ return (window.DIV_VERIFIED||{})[code]||null; }
function enhanceCards(){
  // 価格判断欄はcardPriceGuideでカード本体へ組み込み済み。
}
function enhanceModal(code){
  const dv=divVerified(code);
  const s=DATA.stocks.find(function(x){return x.code===code;});
  if (!s) return;
  const ti=triggerInfo(s);
  let html="";
  if (ti){
    if(ti.unknown){
      html+="<h3>買い増し基準</h3><p class=\"kome c-orange\">前回購入価格が未確認のため、20%基準は表示していません。平均取得単価では代用していません。</p>";
    }else if(ti.kind==="candidate"){
      html+="<h3>新規購入の価格目安</h3><div class=\"kv\"><div><span>現在値（自動取得）</span><b>"+yen(eff(s).price)+"</b></div><div><span>52週安値（補助目安）</span><b>"+yen(ti.basis)+"</b></div><div><span>52週安値から</span><b>"+(ti.gap>=0?"+":"")+fmt(ti.gap,1)+"%</b></div></div><p class=\"kome\">52週安値はリベ大流の中心ルールではありません。配当・財務・過去の利回りやPER/PBRと一緒に確認します。</p>";
    }else{
      const current=eff(s).price, fromLast=(current/ti.last-1)*100;
      const status=ti.triggered?"20%基準到達・要確認":ti.observing?"観察圏（-10〜-20%）":"基準未到達";
      html+="<h3>暴落時の買い増し基準</h3><div class=\"kv\"><div><span>現在値（自動取得）</span><b>"+yen(current)+"</b></div><div><span>前回購入価格</span><b>"+yen(ti.last)+"</b></div><div><span>前回購入比</span><b class=\""+(fromLast<=-20?"c-red":ti.observing?"c-orange":"c-blue")+"\">"+(fromLast>=0?"+":"")+fmt(fromLast,1)+"%</b></div><div><span>20%基準</span><b>"+yen(ti.basis)+"</b></div>"+(ti.watchBasis?"<div><span>ディフェンシブ観察線（-10%）</span><b>"+yen(ti.watchBasis)+"</b></div>":"")+"<div><span>現在の状態</span><b class=\""+(ti.triggered?"c-red":ti.observing?"c-orange":"")+"\">"+status+"</b></div></div><p class=\"kome\">基準到達は自動的な買いサインではありません。業績・配当の安全性を確認し、今回分を2〜3回に分けます。購入後は、その約定価格を次の「前回購入価格」に更新してください。</p>";
    }
  }
  if (dv){
    const cuts=(dv.cuts||[]).map(function(c){
      return "<li>"+c.year+"年: "+c.from+"→"+c.to+"円"+(c.note?"（"+c.note+"）":"")+"</li>";
    }).join("");
    html+="<h3>配当調査メモ <span class=\"badge\">"+dv.tier+"</span></h3>";
    if (dv.years_confirmed) html+="<p class=\"kome\">確認期間: "+dv.years_confirmed+"</p>";
    html+= cuts ? ("<ul style=\"margin-left:18px;font-size:12.5px\">"+cuts+"</ul>") : "<p class=\"kome\">実質減配の記録なし</p>";
    if (dv.notes) html+="<p class=\"kome\">"+dv.notes+"</p>";
  }
  const st=dividendStability(s), h=st.history;
  if (h.length){
    const rows=h.map(x=>`<tr><td>${x.year}年</td><td style=\"text-align:right\">${fmt(x.value,0)}円</td></tr>`).join("");
    const color={blue:"#0b3d91",aqua:"#007f9e",green:"#2f8f3e",amber:"#b86b00",red:"#c6283d","red-partial":"#c6283d",pending:"#687384",short:"#9aa3b2"}[st.key]||"#9aa3b2";
    html+=`<h3>配当推移（${h[0].year.slice(0,4)}〜${h[h.length-1].year.slice(0,4)}年）</h3><div class=\"divtrend\"><div class=\"divtrend-head\"><span class=\"divtrend-label b-${st.key}\">${st.label}</span><span>${h.length}年分</span></div>${dividendSparkline(h,color)}</div><div class=\"tblwrap\"><table class=\"divtable\"><thead><tr><th>年度</th><th style=\"text-align:right\">確定配当（1株）</th></tr></thead><tbody>${rows}</tbody></table></div><p class=\"kome\">株式分割の影響を含むデータです。配当の増減は、必要に応じて下の調査メモも確認してください。</p>`;
  }
  if (html) $("modal").insertAdjacentHTML("beforeend", html);
}
